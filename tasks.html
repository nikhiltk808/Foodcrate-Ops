<!DOCTYPE html>
<html>
<head>
    <title>Tasks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a href="/" class="btn btn-outline-light btn-sm">← Back</a>
        <span class="navbar-brand">📋 Checklists</span>
    </div>
</nav>

<div class="container">
    {% for list in checklists %}
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="m-0">{{ list.title }}</h5>
        </div>
        <div class="card-body">
            <form action="/api/submit_checklist" method="POST" enctype="multipart/form-data">
                <input type="hidden" name="checklist_id" value="{{ list.id }}">
                
                {% for task in list.tasks %}
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="task_{{ loop.index }}" id="t{{ list.id }}_{{ loop.index }}">
                    <label class="form-check-label" for="t{{ list.id }}_{{ loop.index }}">
                        {{ task }}
                    </label>
                </div>
                {% endfor %}

                <div class="mb-3">
                    <label class="form-label fw-bold">📸 Photo Proof (Optional)</label>
                    <input type="file" name="photo" class="form-control" accept="image/*">
                </div>

                <button type="submit" class="btn btn-success w-100">Submit Report</button>
            </form>
        </div>
    </div>
    {% endfor %}
</div>

</body>
</html>
