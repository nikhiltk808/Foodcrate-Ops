<!DOCTYPE html>
<html>
<head>
    <title>Zion Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #4F46E5; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 100%; max-width: 380px; padding: 40px; border-radius: 20px; border: none; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>
    <div class="card">
        <h2 class="text-center fw-bold mb-4" style="color: #4F46E5">Welcome</h2>
        {% if error %}<div class="alert alert-danger p-2 text-center small mb-3">{{ error }}</div>{% endif %}
        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="fw-bold small text-muted">NAME / ID</label>
                <input name="name" class="form-control form-control-lg bg-light border-0" placeholder="e.g. Admin" required>
            </div>
            <div class="mb-4">
                <label class="fw-bold small text-muted">PIN</label>
                <input type="password" name="pin" class="form-control form-control-lg bg-light border-0" placeholder="••••" required>
            </div>
            <button class="btn btn-primary w-100 btn-lg fw-bold">Login</button>
        </form>
    </div>
</body>
</html>
